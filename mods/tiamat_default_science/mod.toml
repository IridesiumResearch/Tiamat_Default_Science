# Tiamat Default Science — Natural Philosophy: the science door of
# Progress's Fork, and everything behind it (docs/brief.md).
#
# Built so far: the Tinker's Bench, five shared nodes a child can reach long
# before the Fork (brief §4). The door, the tree and the machines behind it
# follow in the brief's build order (§17).
id = "tiamat_default_science"
name = "Tiamat Default Science"
version = "0.1.0"
description = "Natural philosophy: machines, steam, electricity, Tesla — and past the aether, gravity and the Fold."
license = "GPL-3.0-only"
# Without any of these there is nothing to build with: the world's rock and
# ore, Life's wool and bodies, Craft's recipes and stations, Progress's nodes
# and door. Hard, so a server missing one says so instead of loading a mod
# that can do nothing (brief §2.2).
depends = [
  "core >=0.1",
  "tiamat_default_world >=0.1",
  "tiamat_default_life >=0.1",
  "tiamat_default_craft >=0.4",
  "tiamat_default_progress >=0.1",
]
# Loaded after these when they are here, so `game.exports` finds them from
# init.lua's first line. Without the interface the Theatrum is a plain
# dialog; without the weather, a kite flies at one height in every sky.
optional_depends = ["tiamat_default_ui", "tiamat_weather"]

# NO `[theme]` HERE, ON PURPOSE. The engine wears the LAST theme in load
# order, and the interface mod owns the look.
