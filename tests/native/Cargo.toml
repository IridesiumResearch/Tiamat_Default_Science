#
# A native check that runs the mod through the engine's real script VM with a
# fake server around it (src/rig.rs) and the REAL sibling mods loaded beside
# it, from their repositories. Run from the repository root, with the engine
# and the siblings checked out beside it (../Tiamat, ../Tiamat_Default_Craft
# and the rest):
#
#     cargo run --manifest-path tests/native/Cargo.toml
[package]
name = "science-native-check"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
tiamat-core = { path = "../../../Tiamat/crates/core" }
